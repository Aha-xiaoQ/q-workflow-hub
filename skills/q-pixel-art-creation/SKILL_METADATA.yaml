skill_id: q-pixel-art-creation
display_name: Q Pixel Art Creation
variant: generic
category: domain
status: candidate
publish_profile: public
source_of_truth: <starter>/skills/q-pixel-art-creation
runtime_paths:
  - <codex-home>/skills/q-pixel-art-creation
activation_contract:
  - trigger: Create, reconstruct, learn, refine, or review a pixel-art character, portrait, action sheet, prop, tileset, or scene at native resolution.
    aliases: [pixel character, pixel character cast, 256 avatar, sprite study, pixel action sheet, pixel-art scene, 像素角色, 像素头像]
    negative_triggers: [general photo pixelization, editable SVG or logo work, ordinary UI icons, game mechanics without asset creation, copy commercial game assets]
    tier: Project
    risk_label: ask
    risk_notes: Original local work is reversible, but close reconstruction, third-party source use, personal-avatar replacement, and public/game integration require provenance and approval gates.
    reference: SKILL.md
    validation_prompt: Reconstruct a user-owned 64px avatar into an exact gridded 256px version, keep it separate from a refined version, and stop before integration until review passes.
output_contract:
  chat_summary: Native size, study/shipping status, source posture, produced assets, validation evidence, independent review, and residual limitations.
  file_outputs: Source card, gridded reconstruction when applicable, native PNG, integer nearest-neighbor preview, validation report, and review report.
  report_path: required
  validation_evidence: validate_pixel_art.py output plus native-size independent visual review.
dependencies: Pillow-capable Python runtime, raster editor as needed, q-agent-roster review, optional imagegen concept exploration, and q-game-canvas-iteration downstream handoff.
composition_boundary:
  mode: pipeline
  upstream: [q-research-discovery, q-skill-pattern-learning]
  downstream: [q-game-canvas-iteration]
  merge_split_status: keep_separate
  notes: This skill owns pixel-art provenance, construction, and visual approval; game iteration owns mechanics and runnable validation; imagegen is optional concept assistance, not an owner or gate replacement.
encoding_guard: required
validation: native 1x first, exact nearest-neighbor preview check, semantic schema/bounds/union positive and negative scenarios, per-sample 1px visual review for precise parts, unseen original-transfer review, conditional character-cast face/silhouette/contact/gray/material/all-cast gates, action/structure review when applicable, and source/runtime hash parity.
review_ownership:
  pre_review_required: conditional
  post_review_required: conditional
  primary_reviewer: Workflow Distiller (沉炼), Visual Arbiter (版衡), and Code Auditor (码鉴) when scripts change
  review_evidence: Private maintainer evidence is not distributed; rerun validators and independent visual review for each new artifact.
sync_notes: Canonical source is copied to runtime and the personal bootstrap recovery mirror after validation; all three maintained trees must match; no company/private counterpart exists; public-safe does not mean stable, published, durable-remote, or colleague-ready.
