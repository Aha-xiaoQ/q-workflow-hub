interface:
  display_name:  Q Workflow
  short_description: Exact Xiao Q commands plus durable project, state, and visual-candidate gates
  default_prompt: Use $q-workflow and its entry router for the requested command, project work, recovery or synchronization. Exact commands use their executable authority gate. Validate the matching task/event state for material work and retain its visibility latch. Reuse authorization within scope and stop revoked actions. Check changed-file mirrors with hashes; whole-workflow stable/install-ready or foundational repair claims retain the required two-round strict suite. Report only the stage supported by current evidence.
