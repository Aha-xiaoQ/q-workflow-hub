interface:
  display_name:  Q Workflow
  short_description: Exact Xiao Q commands plus durable project, state, and visual-candidate gates
  default_prompt: Exact TODO/todo/TODO:, TOKEN/token, help/帮助, status/状态, 小Q/继续小Q/resume/continue are foundational commands. Route them before free-form interpretation using references/base-command-contract.json; exact TODO must run scripts/q_base_command.py against q-profile authority and must never be guessed from a filename search or stale runtime mirror. Keep ordinary TODO/status/resume output lightweight through q-assistant-profile, but escalate immediately when the executable gate reports missing authority, malformed state, or mirror drift. If q-assistant-profile is not present in the loaded skill set, q-workflow is the fallback wake router: bare 小Q/xiaoQ/resume/continue must not receive a casual greeting; run the bounded quick-resume gate and use `【小Q工作流 | 快速恢复 】<current-state>` as the first line. Use q-workflow for workflow-health/体检, context governor execution, release readiness, source/runtime sync, workflow identity, or concrete project workflow operations. For explicit operations, use the shortest bounded script/check first, prefer `$env:Q_WORKFLOW_PYTHON` or `python`, avoid broad tree scans and repeated launchers, and summarize status/report path/top findings. A synced/stable/install-ready claim requires workflow_stability_suite.py --rounds 2 --check-only --strict --stdout to pass. Preserve approval gates for push publish release labels destructive cleanup credentials hardware/flash public/customer sync and unclear data exposure.
